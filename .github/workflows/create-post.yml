name: Create carousel (with review)

# Manual only: makes a carousel and opens a review PR; merging it posts.
# Daily automatic posting is in auto-post.yml.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave empty to use the next one from topics.txt)"
        required: false
        default: ""
      slot:
        description: "morning = MBBS style, evening = PG style"
        required: false
        default: "morning"
        type: choice
        options: [morning, evening]

permissions:
  contents: write
  pull-requests: write

concurrency: create-post

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium

      - name: Write slides with Gemini
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          SLOT: ${{ github.event.inputs.slot }}
        run: echo "slug=$(python agent/generate.py | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Render slide images
        run: python agent/render.py "posts/${{ steps.gen.outputs.slug }}"

      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          BRANCH="post/$SLUG"
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "posts/$SLUG"
          git commit -m "New carousel: $SLUG"
          git push --force origin "$BRANCH"
          python agent/pr_body.py "posts/$SLUG" "$BRANCH" > pr.md
          gh pr create --title "📸 Review: $SLUG" --body-file pr.md --base main --head "$BRANCH"
