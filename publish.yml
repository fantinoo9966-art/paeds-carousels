name: Publish to Instagram

# Runs when you merge (approve) a review PR.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'post/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post carousel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          SLUG="${HEAD_REF#post/}"
          python agent/publish.py "posts/$SLUG"
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add "posts/$SLUG/published.json"
          git commit -m "Published $SLUG" && git push
