name: Re-render edited slides

# When you edit slides.json inside a review PR, this rebuilds the images on that PR.
on:
  pull_request:
    branches: [main]
    paths: ["posts/**/slides.json"]

permissions:
  contents: write

jobs:
  rerender:
    if: startsWith(github.head_ref, 'post/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Render and push
        run: |
          SLUG="${GITHUB_HEAD_REF#post/}"
          python agent/render.py "posts/$SLUG"
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add "posts/$SLUG"
          git diff --cached --quiet || (git commit -m "Re-render $SLUG" && git push)
